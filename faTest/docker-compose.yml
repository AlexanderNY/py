version: '3.8'
services:
  server:
    build: ./server
    ports:
      - "8000:8000"
    networks:
      - app-network
    environment:
      - API_URL=http://server:8000
 
  client:
    build: ./consumer
    depends_on:
      - server
    ports:
      - "8080:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge